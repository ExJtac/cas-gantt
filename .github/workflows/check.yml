name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cas_gantt_test
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: cas_gantt_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cas_gantt_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GANTT_TEST_DATABASE_URL: postgres://cas_gantt_test:ci-test-only@127.0.0.1:5432/cas_gantt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
